# =============================================================================
# Script Configuration
# =============================================================================
#
# This file contains customer-specific settings used by Groovy scripts.
#
# Scripts may use these properties to customize message normalization,
# filtering, FHIR lookups, identifier generation, location mapping,
# terminology handling, workflow rules, and other implementation-specific
# behavior.
#
# Property names and meanings are defined entirely by the customer scripts.
# The FHIR Integration Engine does not interpret these values directly.
#
# Typical examples:
#
#   defaultTimezone=+0200
#   orderNamespace=Labor
#   realWardList=ICU,Intensiv
#   missingBedHandling=WARN
#   facilityCode=HOSPITAL_A
# 
# Environment variables may also be referenced:
#
#   api.token=${API_TOKEN}
#   endpoint.url=${FHIR_ENDPOINT}
#
# -----------------------------------------------------------------------------
# Customer-specific properties
# -----------------------------------------------------------------------------
scriptVersion=demo-hospital-v1.0.0

enable_debug=true

# CDT (Central Daylight Time), UTC−5.
defaultTimezone=-0500
